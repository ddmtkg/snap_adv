name: Windows security build
on:
  push:
    branches: [security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MCP dependencies
        run: python -m pip install -e ./mcp-server
      - name: MCP tests
        run: python -m unittest discover -s mcp-server/tests -v
      - name: Windows installer tests
        shell: pwsh
        run: ./tests/install-windows.ps1
      - name: Node tests
        run: node --test app/src/export-scale.test.mjs
      - name: Install Node dependencies
        working-directory: app
        run: npm ci
      - name: Build Windows NSIS installer
        working-directory: app
        run: npx tauri build --bundles nsis
      - name: Display installer SHA-256
        shell: pwsh
        run: Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: snap-adv-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
