name: Windows security build
on:
  push:
    branches: [security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MCP dependencies
        run: python -m pip install -e ./mcp-server
      - name: MCP tests
        run: python -m unittest discover -s mcp-server/tests -v
      - name: Windows installer tests
        shell: pwsh
        run: ./tests/install-windows.ps1
      - name: Node tests
        run: node --test app/src/export-scale.test.mjs
      - name: Install Node dependencies
        working-directory: app
        run: npm ci
      - name: Build Windows NSIS installer
        working-directory: app
        run: npx tauri build --bundles nsis
      - name: Installed Windows app smoke test
        run: python tests/windows-smoke.py
      - name: Package Windows download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe dist/
          Copy-Item app/src-tauri/target/release/snap.exe dist/snap-portable.exe
          Copy-Item WINDOWS-QUICKSTART.md dist/README.md
          Copy-Item LICENSE dist/LICENSE.txt
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: snap-adv-windows-installer
          path: dist/*
          if-no-files-found: error
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-log
          path: ~/.snap/snap.log
          if-no-files-found: ignore
